    <form>

        <legend>Información Personal</legend>

          <input id="nombre" type="text">
        <label for="email">Email:</label>
          <input id="email" type="email">
        <label for="telefono" aria-placeholder="Ejemplo: 1234567890">Teléfono de contacto:</label>
          <input id="telefono" type="text">  
      </fieldset>
    </form>

    <form>

          <input id="promedio" type="number">
        <label for="carrera">Carrera deseada:</label>
        <select id="carrera"> 
            <option value="value1">Informática</option>
            <option value="value2">Ingeniero Software</option>
            <option value="value3">Ingeniero Industrial</option>
      </fieldset>
    </form>
