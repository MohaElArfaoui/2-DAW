<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura responsive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .caja {
            border: 3px solid black;
            padding: 5px 15px;
        }
    </style>
</head>
<body>

    <div class="container">


        <div class="row g-0">
            <div class="col-6 col-md-3 caja">1</div>
            <div class="col-6 col-md-3 caja">2</div>
            <div class="col-6 col-md-3 caja">3</div>
            <div class="col-6 col-md-3 caja">4</div>
        </div>


        <div class="row g-0">
            <div class="col-12 col-md-6 col-lg caja">1</div>
            <div class="col-12 col-md-6 col-lg caja">2</div>
            <div class="col-12 col-md-6 col-lg caja">3</div>
            <div class="col-12 col-md-6 col-lg caja">4</div>
            <div class="col-12 col-md-6 col-lg caja">5</div>
            <div class="col-12 col-md-6 col-lg caja">6</div>
            <div class="col-12 col-md-6 col-lg caja">7</div>
            <div class="col-12 col-md-6 col-lg caja">8</div>
            <div class="col-12 col-md-6 col-lg caja">9</div>
            <div class="col-12 col-md-6 col-lg caja">10</div>
        </div>

    </div>

</body>
</html>
