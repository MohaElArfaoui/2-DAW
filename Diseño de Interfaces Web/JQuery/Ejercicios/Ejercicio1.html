<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista con hover</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <ul id="lista">
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3</li>
        <li>Elemento 4</li>
        <li>Elemento 5</li>
    </ul>

    <script>
        $(document).ready(function () {
            $("#lista li").hover(
                function () {
                    $(this).css("background-color", "lightblue");
                },
                function () {
                    $(this).css("background-color", "");
                }
            );
        });
    </script>
</body>
</html>
