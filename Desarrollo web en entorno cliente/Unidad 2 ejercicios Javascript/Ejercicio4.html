<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=Number(prompt("Introduce un numero para multiplicar hasta 10"));
        let resultado;
        let contador=1;
       
        for(let i=0; i<10; i++) {
                resultado = num *contador;
                contador++;
            document.write(resultado + "<br>");
      
        }

    </script>
</body>
</html>
