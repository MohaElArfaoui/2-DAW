      //Diamante;

      let array = [];
      let tamanioLargo = 1;
      const tamanioVertical = 9;
      const asterisco = "*";

      for (let i = 0; i < tamanioVertical; i++) {
        array[i] = [];
        for (let j = 0; j < tamanioLargo; j++) {
          array[i][j] = asterisco + " ";
        }
        if (i < 4) {
          tamanioLargo += 2;
        } else {
          tamanioLargo -= 2;
        }
      }

      for (let i = 0; i < tamanioVertical; i++) {
        for (let j = 0; j < array[i].length; j++) {
          document.write(array[i][j]);
        }
        document.write("<br>");
      }
