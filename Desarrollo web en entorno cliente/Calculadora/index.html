<html lang="en">
  <head>
    
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="theme-color" content="#33b5e5">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://mdbcdn.b-cdn.net/wp-content/themes/mdbootstrap4/docs-app/css/dist/mdb5/standard/core.min.css">
  <link rel="stylesheet" id="roboto-subset.css-css" href="https://mdbcdn.b-cdn.net/wp-content/themes/mdbootstrap4/docs-app/css/mdb5/fonts/roboto-subset.css?ver=3.9.0-update.5" type="text/css" media="all">

  <meta charset="utf-8">
  <title>Calculadora</title>
  
  <meta name="description" content="Responsive Calculator built with Bootstrap 5. Easy to use and customize calculator component designed in Material Design.">
  <meta name="image" content="https://mdbcdn.b-cdn.net/wp-content/themes/mdbootstrap4/content/en/_mdb5/standard/pro/_main/assets/mdb5-about-v2.jpg">
  
  <meta itemprop="name" content="Bootstrap Calculator - free examples &amp; tutorial.">
  <meta itemprop="description" content="Responsive Calculator built with Bootstrap 5. Easy to use and customize calculator component designed in Material Design.">
  <meta itemprop="image" content="https://mdbcdn.b-cdn.net/wp-content/themes/mdbootstrap4/content/en/_mdb5/standard/pro/_main/assets/mdb5-about-v2.jpg">

  <link rel="shortcut icon" href="https://mdbcdn.b-cdn.net/wp-content/themes/mdbootstrap4/favicon.ico">

  <link rel="canonical" href="https://mdbootstrap.com/docs/standard/extended/calculator/">
  <link rel="stylesheet" href="estilos.css">

</head>
<body>


  <!--Section: Demo-->
<section class="pb-4">
<div class="bg-white border rounded-5">

  
  <section class="p-4 text-center justify-content-center w-100">
    <div class="container justify-content-center d-flex my-4">  
       
      <div class="calculator card d-flex">

        <input type="text" id="pantalla" class="calculator-screen z-depth-1" value="" disabled="">
    
        <div class="calculator-keys">
           
            <button type="button" id="suma" class="operator btn btn-info btn-calculator" value="+">+</button>
            <button type="button" class="operator btn btn-info btn-calculator" value="-">-</button>
            <button type="button" class="operator btn btn-info btn-calculator" value="*">×</button>
            <button type="button" class="operator btn btn-info btn-calculator" value="/">÷</button>
                       
            <button type="button" id="tecla7" value="7" class="btn btn-light waves-effect btn-calculator col">7</button>
            <button type="button" id="tecla8" value="8" class="btn btn-light waves-effect btn-calculator col">8</button>
            <button type="button" value="9" class="btn btn-light waves-effect btn-calculator col">9</button>
                   
            <button type="button" value="4" class="btn btn-light waves-effect btn-calculator col">4</button>
            <button type="button" value="5" class="btn btn-light waves-effect btn-calculator col">5</button>
            <button type="button" value="6" class="btn btn-light waves-effect btn-calculator col">6</button>
                    
            <button type="button" value="1" class="btn btn-light waves-effect btn-calculator col">1</button>
            <button type="button" value="2" class="btn btn-light waves-effect btn-calculator col">2</button>
            <button type="button" value="3" class="btn btn-light waves-effect btn-calculator col">3</button>
                   
            <button type="button" value="0" class="btn btn-light waves-effect btn-calculator col">0</button>
            <button type="button" class="decimal function btn btn-secondary btn-calculator col" value=".">.</button>
            <button type="button" class="all-clear function btn btn-danger btn-sm btn-calculator col" value="all-clear">AC</button>
          

            <button type="button" id="resultado" class="equal-sign operator btn btn-default btn-calculator" value="=">=</button>
    
        </div>
      </div>
    </div>
  </section>
</div>
</section>
<script src="Calculadora/calculadora.js"></script>
</body>

</html>
