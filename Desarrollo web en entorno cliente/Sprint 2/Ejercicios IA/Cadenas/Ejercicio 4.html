  <body>
    <script>
      /*esPalindromo(str) — Ignorando espacios y mayúsculas.
esPalindromo("Anita lava la tina") → true*/
let cadena=prompt("Introduce una cadena");
function esPalindromo(cadena) {
  let cadenaMin=cadena.toLowerCase();
  let cadenaSinEspacios=cadenaMin.replaceAll(" ","");
  let cadenaAlreves="";
  for (let i = cadenaSinEspacios.length -1; i >= 0; i--) {
     cadenaAlreves += cadenaSinEspacios[i];
    
  }

  if (cadenaSinEspacios===cadenaAlreves) {
    return true;
  } else {
    return false;
  }

}
console.log(esPalindromo(cadena));
    </script>
  </body>
</html>
