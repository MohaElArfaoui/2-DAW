<!doctype html>

    <meta charset="UTF-8" />

  <body>
    <script>
      /*camelize(str) — Convierte guiones a camelCase.
camelize("background-color") → "backgroundColor"
camelize("-webkit-transition") → "WebkitTransition"*/
function ucFirst(palabra) {
  return palabra.slice(0,1).toUpperCase() + palabra.substring(1);
}
let str=prompt("Introduce la cadena");
/**
 * @param {string} str
 */
function camelize(str) {
  let cadenaSeparada=str.split("-");
  let cadenaCamel=cadenaSeparada[0]; 
  
  for (let i = 1; i < cadenaSeparada.length; i++) {
     cadenaCamel += ucFirst(cadenaSeparada[i]);
  }
  return cadenaCamel;

}
console.log(camelize(str));
    </script>
  </body>
</html>
