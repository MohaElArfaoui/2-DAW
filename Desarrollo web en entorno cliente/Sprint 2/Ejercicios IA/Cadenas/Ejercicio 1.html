    <script>
            /*ucWords(str) — Primera letra de cada palabra en mayúscula. Reutiliza tu ucFirst.
      ucWords("hola mundo cruel") → "Hola Mundo Cruel"*/

      let cadena =prompt("Introduce una cadena en minuscula. Se pondra cada comienzo de palabra en mayuscula")
      
      function ucFirst(palabra){
        return palabra.slice(0,1).toUpperCase() + palabra.substring(1) + " ";
      }
      
      /**
       * @param {string} cadena
       */
      function ucWords(cadena){
        let cadenaSeparada=cadena.split(" ");
        let cadenaMayus="";
        for (let i = 0; i < cadenaSeparada.length; i++) {
           cadenaMayus += ucFirst(cadenaSeparada[i]) + " ";
        }
        return cadenaMayus.trim();

      }
      console.log(ucWords(cadena));
