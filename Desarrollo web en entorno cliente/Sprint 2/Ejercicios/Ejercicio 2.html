<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*Realizar una función denominada showABC() que muestre los números naturales
comprendidos entre 65 y 220 en sus correspondientes caracteres del alfabeto.*/
        function showABC() {
            let abecedario = "";
            // Cada número del 65 al 220 se convierte en su carácter (65 es la "A")
            for (let i = 65; i <= 220; i++) {
                abecedario += String.fromCodePoint(i) + " ";
            }
            alert(abecedario.trim());
        }
        showABC();
    </script>
</body>
</html>
