<!DOCTYPE html>
<html lang="es">
<head>
    <title>Examen DAW</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <script src="bootstrap/js/bootstrap.min.js"></script>
    <script defer type="text/javascript" src="js/codigo.js"></script>
    <link rel="stylesheet" href="estilos/estilo.css">
</head>

<body>

 <div class="topnav" id="menu">
      <a class="active" href="#">DAW</a>
      <div class="topnav-right">
        <a href="#" id="gestionSesion">Iniciar Sesión</a>
      </div>
  </div> 

  <!--Formulario login app-->
  <form id="formLoginUsuario" name="formLoginUsuario">
      <div class="col-6 border" style="margin:20px auto 20px; padding: 20px;">
        <h2 style="text-align: center;">Inicio de Sesión</h2>
        <div class="form-group row" style="padding-top: 15px;">
          <label for="usuarioLogin" class="col-4 col-form-label">Usuario</label> 
          <div class="col-8">
            <input id="usuarioLogin" name="usuarioLogin" type="text" class="form-control">
          </div>
        </div>

        <div class="form-group row" style="padding-top: 15px;">
          <label for="contrasenaLogin" class="col-4 col-form-label">Contraseña</label> 
          <div class="col-8">
            <input id="contrasenaLogin" name="contrasenaLogin" type="password" class="form-control">
          </div>
        </div>
        <div class="form-group row" style="padding-top: 15px;">
          <div class="col-4">
            <button name="btnLoginUsuario" id="btnLoginUsuario" type="button" class="btn btn-primary">iniciar Sesión</button>
          </div>
          <div class="col-8">
            <a id="regUsuario" href="#">Registrate</a>
          </div>
        </div>
      </div>
  </form>
      

  <!--Formulario usado para registrar usuarios-->
  <form id="formUsuario" name="formUsuario">
      <div class="col-6 border" style="margin:20px auto 20px; padding: 20px;">
        <h2 style="text-align: center;">Registro de Usuario</h2>    
        <div class="form-group row" style="padding-top: 15px;">
          <label for="usuario" class="col-4 col-form-label">Usuario</label> 
          <div class="col-8">
            <input id="usuario" name="usuario" type="text" class="form-control">
          </div>
        </div>
        <div class="form-group row" style="padding-top: 15px;">
          <label for="contrasena" class="col-4 col-form-label">Contraseña</label> 
          <div class="col-8">
            <input id="contrasena" name="contrasena" type="password" class="form-control">
          </div>
        </div>
        <div class="form-group row" style="padding-top: 15px;">
          <label for="contrasenaRepetida" class="col-4 col-form-label">Repetir Contraseña</label> 
          <div class="col-8">
            <input id="contrasenaRepetida" name="contrasenaRepetida" type="password" class="form-control">
          </div>
        </div>
        <div class="form-group row" style="padding-top: 15px;">
          <div class="offset-4 col-8">
            <button name="btnRegistrarUsuario" id="btnRegistrarUsuario" type="button" class="btn btn-primary" value="registrar">Registrar</button>
          </div>
        </div>
      </div>
  </form>

  <div class="container" id="capaPeliculas">
    <div class="row">
       <div class="col"><img src="images/Pelicula-01.png" id="imgPelicula1" alt="Pelicula 1" data-idPelicula="1" class="img-fluid"></div>
       <div class="col"><img src="images/Pelicula-02.png" id="imgPelicula2" alt="Pelicula 2" data-idPelicula="2" class="img-fluid"></div>
       <div class="col"><img src="images/Pelicula-03.png" id="imgPelicula3" alt="Pelicula 3" data-idPelicula="3" class="img-fluid"></div>
       <div class="col"><img src="images/Pelicula-04.png" id="imgPelicula4" alt="Pelicula 4" data-idPelicula="4" class="img-fluid"></div>
    </div>
  </div>

  <div class="row" id="detallesPelicula">
       <div class="col" style="margin-top: 20px; margin-bottom: 20px; margin-left: 50px; margin-right: 50px;">
          <h4>Titulo</h4>
          <p id="tituloPelicula"></p>
          <h4>Sinopsis</h4>
          <p id="sinopsisPelicula"></p>
          <h4>Duracion</h4>
          <p id="duracionPelicula"></p>
       </div>
  </div>
</body>
</html>
