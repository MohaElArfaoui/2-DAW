<!DOCTYPE html>
<html lang="es">
<head>
    <title>Simulacro Sprint 3</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <script src="bootstrap/js/bootstrap.min.js"></script>
    <!-- OJO: sin defer -->
    <script src="js/clases.js"></script>
    <script src="js/codigo.js"></script>

    <style>
      .capaLibros {
        height: 220px;
        overflow-y: auto;
        width: 100%;
        border: 1px solid lightgrey;
      }
      .capaFicha {
        height: 220px;
        overflow-y: auto;
        width: 100%;
        border: 1px solid lightgrey;
        padding: 10px;
      }
    </style>
</head>

<body>
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Biblioteca DAW</a>
    </div>
  </nav>

  <div class="container" style="margin: 25px auto">
    <div class="row justify-content-start">

      <div class="col-4" id="divLibros">
        <div style="margin-bottom: 15px;">Libros:</div>
        <!--Capa que contiene el listado de libros-->
        <div class="capaLibros" id="divListaLibros"></div>
        <br>
        <button type="button" class="btn btn-primary" id="btnNuevo">Nuevo libro</button>
      </div>

      <div class="col-8" id="divDetalle">
        <div style="margin-bottom: 15px;">Ficha del libro:</div>
        <!--Capa que contiene la ficha-->
        <div class="capaFicha" id="divFicha"></div>
        <br>
        <button type="button" class="btn btn-warning" id="btnPrestar">Prestar / Devolver</button>
        <button type="button" class="btn btn-info" id="btnEditar">Editar</button>
        <button type="button" class="btn btn-danger" id="btnBorrar">Borrar</button>
      </div>

      <form id="formLibro" name="formLibro">
        <div class="col-6 border" style="margin:20px auto 20px; padding: 20px;">
          <h2 style="text-align: center;">Libro</h2>
          <div class="form-group row" style="padding-top: 15px;">
            <label for="txtIsbn" class="col-4 col-form-label">ISBN</label>
            <div class="col-8"><input id="txtIsbn" name="isbn" type="text" class="form-control"></div>
          </div>
          <div class="form-group row" style="padding-top: 15px;">
            <label for="txtTitulo" class="col-4 col-form-label">Título</label>
            <div class="col-8"><input id="txtTitulo" name="titulo" type="text" class="form-control"></div>
          </div>
          <div class="form-group row" style="padding-top: 15px;">
            <label for="txtAutor" class="col-4 col-form-label">Autor</label>
            <div class="col-8"><input id="txtAutor" name="autor" type="text" class="form-control"></div>
          </div>
          <div class="form-group row" style="padding-top: 15px;">
            <label for="txtAnio" class="col-4 col-form-label">Año</label>
            <div class="col-8"><input id="txtAnio" name="anio" type="text" class="form-control"></div>
          </div>
          <div class="form-group row" style="padding-top: 15px;">
            <div class="col-4"></div>
            <div class="col-4">
              <button id="btnGuardar" type="button" class="btn btn-primary">Guardar</button>
            </div>
          </div>
        </div>
      </form>

    </div>
  </div>
</body>
</html>
