<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro@5.21.1/dist/css/coreui.min.css" rel="stylesheet">
    <title>CoreUI Date Picker Example</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro@5.21.1/dist/js/coreui.bundle.min.js"></script>
    
  </head>
  <body class="p-3 m-0 border-0 docs-example m-0 border-0">
    <!-- Example Code Start-->
    <div class="row">
      <div class="col-sm-6 col-lg-5 mb-3 mb-sm-0">
        <div data-coreui-locale="en-US" data-coreui-toggle="date-picker"></div>
      </div>
      <div class="col-sm-6 col-lg-5">
        <div data-coreui-date="2023/03/15" data-coreui-locale="en-US" data-coreui-toggle="date-picker"></div>
      </div>
    </div>
    <!-- Example Code End -->
  </body>
</html>
