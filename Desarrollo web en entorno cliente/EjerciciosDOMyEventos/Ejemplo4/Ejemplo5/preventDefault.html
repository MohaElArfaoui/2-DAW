<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p>Haz clic derecho aquí para el menú contextual del documento</p>
    <button id="elem">Haz clic derecho aquí para el menú contextual del botón</button>

    <script>
    document.getElementById("elem").addEventListener("contextmenu", menu1);
    document.addEventListener("contextmenu", menu2);
    
    function menu1(event){
        event.preventDefault();
        alert("Menú contextual del botón");
        event.stopPropagation();
    }

     function menu2(event){
        event.preventDefault();
        alert("Menú contextual del documento");
    }
    </script>
    
</body>
</html>
