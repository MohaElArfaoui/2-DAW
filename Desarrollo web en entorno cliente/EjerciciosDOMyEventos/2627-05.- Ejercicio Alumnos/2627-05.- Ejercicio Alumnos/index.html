<!DOCTYPE html>
<html lang="es">
<head>
    <title>Examen DAW</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="assets/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Examen</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="#" id="registroAlumnos">Registro Alumn@s</a>
              </li>
              <li class="nav-item" >
                <a class="nav-link" href="#" id="registroNotas">Registrar Notas</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#" id="listadoAlumnos">Listado Alumnos</a>
              </li>  
              <li class="nav-item">
                <a class="nav-link" href="#" id="notasMedias">Notas Medias</a>
              </li>    
              <li class="nav-item">
                <a class="nav-link" href="#" id="cerrarSesion">Cerrar Sesión</a>
              </li>
            </ul>
          </div>
        </div>
    </nav>

    <!--Formulario usado para registrar los alumnos-->
    <form id="formRegistrarAlumno" name="formRegistrarAlumno">
      <div class="col-6 border" style="margin:20px auto 20px; padding: 20px;">
        <h2 style="text-align: center;">Registrar Alumn@</h2>
        <div class="form-group row" style="padding-top: 15px;">
          <label for="nombre" class="col-4 col-form-label">Nombre</label> 
          <div class="col-8">
            <input id="nombre" name="nombre" type="text" class="form-control">
          </div>
        </div>
        <div class="form-group row" style="padding-top: 15px;">
          <label for="Apellidos" class="col-4 col-form-label">Apellidos</label> 
          <div class="col-8">
            <input id="apellidos" name="Apellidos" type="text" class="form-control">
          </div>
        </div>
        <div class="form-group row" style="padding-top: 15px;">
          <label for="usuario" class="col-4 col-form-label">Usuario</label> 
          <div class="col-6">
            <input id="usuario" name="usuario" type="text" class="form-control" disabled>
          </div>
          <div class="col-2">
            <button name="btnCrearUsuario" id="btnCrearUsuario" type="button" class="btn btn-primary">Crear</button>
          </div>
        </div>
        <div class="form-group row" style="padding-top: 15px;">
          <label for="contrasena" class="col-4 col-form-label">Contraseña</label> 
          <div class="col-8">
            <input id="contrasena" name="contrasena" type="password" class="form-control">
          </div>
        </div>
        <div class="form-group row" style="padding-top: 15px;">
          <label for="correo" class="col-4 col-form-label">Correo</label> 
          <div class="col-8">
            <input id="correo" name="correo" type="text" class="form-control">
          </div>
        </div> 
        <div class="form-group row" style="padding-top: 15px;">
          <div class="offset-4 col-8">
            <button name="btnRegistrarAlumno" id="btnRegistrarAlumno" type="button" class="btn btn-primary">Registrar</button>
          </div>
        </div>
      </div>
    </form>
   
    
    <!--Formulario usado para registrar las notas del alumnado-->
    <form id="formRegistrarNotas" name="formRegistrarNotas">
      <div class="col-6 border" style="margin:20px auto 20px; padding: 20px;">
        <h2 style="text-align: center;">Registrar Nota</h2>
        <div class="form-group row" style="padding-top: 15px;">
          <label for="nombre" class="col-4 col-form-label">Alumn@</label> 
          <div class="col-8">
            <select class="form-select" id="selAlumno" name="selAlumno"></select>
          </div>
        </div>
        <div class="form-group row" style="padding-top: 15px;">
          <label for="Apellidos" class="col-4 col-form-label">Asignatura</label> 
          <div class="col-8">
            <select class="form-select" id="selNota" name="selNota">
              <option value="cliente">Desarrollo Web Cliente</option>
              <option value="servidor">Desarrollo Web Servidor</option>
              <option value="despliegue">Despliegue Aplicaciones Web</option>
              <option value="interfaces">Diseño Interfaces Web</option>
              <option value="empresa">Empresa e Iniciativa</option>
              <option value="proyecto">Proyecto Integrado</option>
            </select>
          </div>
        </div>
        <div class="form-group row" style="padding-top: 15px;">
          <label for="nota" class="col-4 col-form-label">Nota</label> 
          <div class="col-8">
            <input id="nota" name="nota" type="number" class="form-control">
          </div>
        </div> 
        <div class="form-group row" style="padding-top: 15px;">
          <div class="offset-4 col-8">
            <button name="btnRegistrarNotas" id="btnRegistrarNotas" type="button" class="btn btn-primary">Registrar</button>
          </div>
        </div>
      </div>
    </form>

    <!--Capa para el listado de todos los alumnos (tabla con botón Eliminar)-->
    <div id="listado" style="display: none; width: 1000px; margin: 30px auto"></div>

    <!--Formulario que muestra las notas del alumno seleccionado en formato tabla-->
    <form id="formDetalle" name="formDetalle">
      <div class="col-6 border" style="margin:20px auto 20px; padding: 20px;">
        <h2 style="text-align: center;">Detalle Alumn@</h2>
        <div class="form-group row" style="padding-top: 15px;">
          <label for="nombre" class="col-4 col-form-label">Alumn@</label> 
          <div class="col-8">
            <select class="form-select" id="selAlumnoDetalle" name="selAlumnoDetalle"></select>
          </div>
        </div>
      </div>
    </form>

    <div id="detalleAlumno" style="display: none; width: 1000px; margin: 30px auto"></div>
    <div id="lNotasMedias" style="display: none; width: 500px; margin: 30px auto"></div>
      

    <script type="text/javascript" src="js/clases.js"></script>
    <script type="text/javascript" src="js/codigo.js"></script>
    <script type="text/javascript" src="js/review.js"></script>
</body>

</html>
