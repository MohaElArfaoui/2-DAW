<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table id="miTabla">
    <tbody>
     <tr>
       <td>Celda 1</td>
       <td>Celda 2</td>
       <td>Celda 3</td>
      </tr>
    </tbody>
    </table>

<script>
  const tabla = document.getElementById('miTabla');
  tabla.addEventListener('click', miFuncion);
     
  function miFuncion(e) {
    // Comprueba si el elemento clicado es un <td>
    const td = e.target.closest('td');
    
    if (td) {
      console.log('Clic en la celda:', td.textContent);
      td.style.backgroundColor = 'yellow';
    }
  }
</script>
</body>
</html>
