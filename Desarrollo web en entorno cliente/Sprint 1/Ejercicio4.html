<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 1</title>
</head>
<body>
     <div id="ejercicio4">
        <script>
            let numero=Number(prompt("Introduce un numero de un digito"));

            while (numero<0 || numero>9) {
                numero=Number(prompt("Introduce un numero de un digito"));
            }

            document.write('<p style=color:# + "numero + numero + numero + numero + numero + numero">' + "Bienvenido al maravilloso mundo de JS "+'</p>');
        </script>
     </div>
   
</body>
</html>
