<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 1</title>
</head>
<body>

        <div id="ejercicio2">
            
            <script>
                let numero =Number(prompt("Introduce un numero entre 1 y 5"));

              if (numero>=1 ||numero <=5) {
                document.write(`<h+numero>` + "Hola mundo" + `</h+numero>`);
              } else {
                alert("El numero introducido no es correcto");
              }

              
            </script>
        </div>
   
</body>
</html>
