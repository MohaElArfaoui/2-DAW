<!DOCTYPE html>
<html lang="es">
<head>
    <title>Examen DAW</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <script src="bootstrap/js/bootstrap.min.js"></script>

    <style>
      .capaUsuarios { 
        height: 400px;
        overflow-y: auto;
        width: 100%;
        border: 1px solid lightgrey;
        font-weight: bold;

      }

      .capaMensajes {
        height: 400px;
        overflow-y: auto;
        width: 100%;
        border: 1px solid lightgrey;
      }
    </style>
</head>

<body>
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Examen recuperación</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Listados</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Casas/Pisos en venta</a></li>
          </ul>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link" href="#">Transferir Offline-Online</a>
        </li>
      </div>
    </div>
</nav>

<!--Formalario para gestionar nuevas viviendas en ventas -->
<form>
  <div class="col-6 border" style="margin:20px auto 20px; padding: 20px;">
    <h2 style="text-align: center;">Gestión Viviendas</h2>
    <br>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="opcion" id="opcion1" checked>
      <label class="form-check-label" for="opcionExamen1">
        Off-Line (Se registra en array)
      </label>      
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="opcion" id="opcion2">
      <label class="form-check-label" for="opcionExamen2">
        On-Line (Se registra en BD)
      </label>      
    </div>
    <br><br>
    <div class="form-group row" style="padding-top: 15px;">
      <label for="cuenta" class="col-4 col-form-label">Tipo:</label> 
      <div class="col-8">
        <select class="form-select">
          <option selected="true" disabled="disabled">seleccione una opción</option>
          <option value="Casa">Casa</option>
          <option value="Piso">Piso</option>
        </select>
      </div>
    </div>
    <div class="form-group row" style="padding-top: 15px;">
      <label for="saldo" class="col-4 col-form-label">Dirección:</label> 
      <div class="col-8">
        <input type="text" class="form-control">
      </div>
    </div>
    <div class="form-group row" style="padding-top: 15px;">
      <label for="saldo" class="col-4 col-form-label">Código Postal:</label> 
      <div class="col-8">
        <input type="text" class="form-control" maxlength="5">
      </div>
    </div>
    <div class="form-group row" style="padding-top: 15px;">
      <label for="saldo" class="col-4 col-form-label">Precio:</label> 
      <div class="col-8">
        <input type="text" class="form-control">
      </div>
    </div>

    <div class="form-group row" style="padding-top: 15px;">
      <div class="offset-4 col-8">
        <button type="button" class="btn btn-primary" id="btnRegistrarCuenta">Registrar</button>
      </div>
    </div>
  </div>
</form>

<script type="text/javascript" src="js/codigo.js"></script>
<script type="text/javascript" src="js/clases.js"></script>
</body>

</html>
